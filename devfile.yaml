schemaVersion: 2.2.2
metadata:
  name: hello-devspaces
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:3.31
      endpoints:
        - exposure: public
          name: nodejs
          protocol: https
          targetPort: 3000
      memoryLimit: '1Gi'
      memoryRequest: '512Mi'
      cpuLimit: '0.5'
      cpuRequest: '0.25'
      mountSources: true
      volumeMounts:
        - name: npm
          path: /home/user/.npm
  - name: npm
    volume:
      size: 1G
commands:
  - id: 1-dependencies
    exec:
      label: "Download dependencies"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "npm install"
      group:
        kind: build
  - id: 2-run
    exec:
      label: "Run the web app"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "node app.js"
      group:
        kind: run
        isDefault: true
